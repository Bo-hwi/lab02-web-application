
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./data-feed.css">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 - DataFeed Verification</title>
</head>
<body>
    <div id="app"></div>

    <p id="test-result" role="status" aria-live="polite">
        Waiting for verification...
    </p>

    <script type="module">
        import { DataFeed } from "./data-feed.js";
        import { renderApp } from "./reactive-engine.js";

        const root = document.getElementById("app");
        const result = document.getElementById("test-result");

        renderApp(DataFeed, root);

        const wait = (ms) =>
            new Promise(resolve => setTimeout(resolve, ms));

        const getStatus = () => {
            if (root.querySelector("button")?.textContent === "Load Data") {
                return "IDLE";
            }

            if (root.querySelector('[role="status"]')) {
                return "LOADING";
            }

            if (root.querySelector("ul")) {
                return "SUCCESS";
            }

            if (root.querySelector('[role="alert"]')) {
                return "ERROR";
            }

            return "UNKNOWN";
        };

        const checks = {};

        // Verify initial IDLE state.
        checks.idle = getStatus() === "IDLE";

        // Trigger the asynchronous request.
        root.querySelector("button").click();

        // Verify immediate LOADING state.
        checks.loading = getStatus() === "LOADING";

        
        // Wait for the first request to fail.
        await wait(1500);

        // Verify the ERROR state.
        checks.error =
            getStatus() === "ERROR";

        // Find the current Retry button after re-rendering.
        const retryButton = [...root.querySelectorAll("button")]
            .find(button =>
                button.textContent.trim() === "Retry Connection"
            );

        checks.retryButton = Boolean(retryButton);

        if (retryButton) {
            retryButton.click();

            // Retry must enter LOADING.
            checks.retryLoading =
                getStatus() === "LOADING";

            await wait(1500);
        } else {
            checks.retryLoading = false;
        }

        // Verify the successful retry.
        checks.success = getStatus() === "SUCCESS";

        // Verify all expected items are rendered.
        checks.items =
            root.querySelectorAll("li").length === 3;


        const passed = Object.values(checks).filter(Boolean).length;
        const total = Object.keys(checks).length;

        result.textContent = `${passed}/${total} checks passed`;

        console.table(checks);
        console.log(result.textContent);
    </script>
</body>
</html>
